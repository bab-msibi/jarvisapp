<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Jarvis · Device approval</title>
<style>
  :root { --bg: #f5f6f8; --card: #fff; --text: #14161a; --faint: #6b7280; --border: #e3e5ea; --accent: #5b7cfa; --ok: #1fa971; --err: #e5484d; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0d0f13; --card: #171a20; --text: #eef0f4; --faint: #8b93a1; --border: #262a33; color-scheme: dark; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
    background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .card { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 28px 22px; text-align: center; }
  .logo { width: 52px; height: 52px; border-radius: 15px; margin: 0 auto 14px; background: var(--accent); color: #fff; font-weight: 800; font-size: 24px; display: flex; align-items: center; justify-content: center; }
  h1 { margin: 0 0 6px; font-size: 21px; letter-spacing: -0.4px; }
  p { margin: 0 0 18px; color: var(--faint); font-size: 14px; }
  label { display: block; text-align: left; font-size: 12px; font-weight: 600; color: var(--faint); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .4px; }
  input { width: 100%; padding: 12px 13px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 15px; margin-bottom: 14px; }
  button { width: 100%; padding: 13px; border: 0; border-radius: 13px; background: var(--accent); color: #fff; font-size: 15px; font-weight: 650; cursor: pointer; }
  button:disabled { opacity: .55; }
  .code { font: 700 30px/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 6px; padding: 16px 0; margin: 4px 0 16px; border-radius: 14px; background: var(--bg); border: 1px dashed var(--border); }
  .wait { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--faint); }
  .dot { width: 8px; height: 8px; border-radius: 4px; background: var(--ok); animation: pulse 1.4s infinite; }
  .err { color: var(--err); font-size: 13px; margin-top: 12px; }
  @keyframes pulse { 50% { opacity: .3; } }
</style>
</head>
<body>
<main class="card">
  <div class="logo">J</div>
  <section id="request" hidden>
    <h1>Request access</h1>
    <p>This device isn't on the Jarvis whitelist yet. Name it and ask for approval.</p>
    <form id="form">
      <label for="name">Device name</label>
      <input id="name" maxlength="60" autocomplete="off" required>
      <button id="submit" type="submit">Request access</button>
    </form>
  </section>
  <section id="pending" hidden>
    <h1>Waiting for approval</h1>
    <p>On your Mac, open Jarvis → Settings → Devices and approve the device showing this code:</p>
    <div class="code" id="code">······</div>
    <div class="wait"><span class="dot"></span>This page opens Jarvis once approved</div>
  </section>
  <div class="err" id="err" hidden></div>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  let timer = null;

  function guessName() {
    const ua = navigator.userAgent;
    const os = /iPhone/.test(ua) ? "iPhone" : /iPad/.test(ua) ? "iPad" : /Android/.test(ua) ? "Android" : /Mac/.test(ua) ? "Mac" : /Windows/.test(ua) ? "Windows PC" : "Device";
    const br = /Edg\//.test(ua) ? "Edge" : /CriOS|Chrome\//.test(ua) ? "Chrome" : /FxiOS|Firefox\//.test(ua) ? "Firefox" : /Safari\//.test(ua) ? "Safari" : "";
    return br ? `${os} · ${br}` : os;
  }

  function show(state, d) {
    $("err").hidden = true;
    $("request").hidden = state !== "none";
    $("pending").hidden = state !== "pending";
    if (state === "pending") {
      $("code").textContent = d.code;
      if (!timer) timer = setInterval(check, 3000);
    }
  }

  function fail(msg) { $("err").textContent = msg; $("err").hidden = false; }

  async function check() {
    try {
      const r = await fetch("/api/devices/me", { cache: "no-store" });
      const d = await r.json();
      if (d.status === "approved" || d.status === "local") return location.reload();
      if (d.status === "none" && timer) { clearInterval(timer); timer = null; } // denied/removed
      show(d.status, d);
    } catch { fail("Can't reach Jarvis — is your Mac online?"); }
  }

  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    $("submit").disabled = true;
    try {
      const r = await fetch("/api/devices/request", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name: $("name").value.trim() }) });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || `HTTP ${r.status}`);
      show(d.status, d);
    } catch (err) { fail(err.message); }
    $("submit").disabled = false;
  });

  $("name").value = guessName();
  check();
</script>
</body>
</html>
