<style>
  :root {
    --accent: #5b8cff;
    --accent-rgb: 91, 140, 255;
    --radius: 22px;
  }
  * { box-sizing: border-box; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: -apple-system, "SF Pro Display", "SF Pro Text", system-ui, sans-serif;
    background: #0a0b10;
    margin: 0; padding: 0;
    min-height: 100vh; min-height: 100dvh; overflow: hidden;
  }
  #root { width: 100%; height: 100vh; height: 100dvh; }

  .device[data-theme="dark"] {
    --bg: #0a0b10;
    --bg-grad-1: rgba(var(--accent-rgb), 0.12);
    --bg-grad-2: rgba(167, 121, 255, 0.07);
    --surface: rgba(255,255,255,0.045);
    --surface-2: rgba(255,255,255,0.07);
    --surface-solid: #14151c;
    --surface-solid-2: #1b1d26;
    --border: rgba(255,255,255,0.09);
    --border-strong: rgba(255,255,255,0.16);
    --text: #f4f6fc;
    --text-dim: rgba(235,238,250,0.62);
    --text-faint: rgba(235,238,250,0.40);
    --text-ghost: rgba(235,238,250,0.22);
    --glass-blur: 22px;
    --shadow: 0 18px 50px rgba(0,0,0,0.55);
    --statusbar: #ffffff;
  }
  .device[data-theme="light"] {
    --bg: #eef0f5;
    --bg-grad-1: rgba(var(--accent-rgb), 0.14);
    --bg-grad-2: rgba(167, 121, 255, 0.10);
    --surface: rgba(255,255,255,0.72);
    --surface-2: rgba(255,255,255,0.95);
    --surface-solid: #ffffff;
    --surface-solid-2: #f6f7fb;
    --border: rgba(15,18,40,0.08);
    --border-strong: rgba(15,18,40,0.14);
    --text: #0c0e16;
    --text-dim: rgba(28,32,54,0.66);
    --text-faint: rgba(28,32,54,0.45);
    --text-ghost: rgba(28,32,54,0.22);
    --glass-blur: 22px;
    --shadow: 0 18px 50px rgba(20,26,60,0.16);
    --statusbar: #0c0e16;
  }

  .device { --ok: #34d399; --ok-soft: rgba(52,211,153,0.16); --warn: #fbbf24; --warn-soft: rgba(251,191,36,0.16);
            --err: #fb6f70; --err-soft: rgba(251,111,112,0.16); --info: var(--accent); --purple: #a779ff; --cyan: #3dd9c9; }

  .device {
    position: relative; width: 100%; height: 100vh; height: 100dvh; overflow: hidden;
    background: var(--bg);
    color: var(--text);
    display: flex; flex-direction: column;
    transition: background-color .4s ease, color .3s ease;
    padding-top: env(safe-area-inset-top, 0px);
  }

  .screen { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; position: relative; -webkit-overflow-scrolling: touch; }
  .screen::-webkit-scrollbar { width: 0; display: none; }
  .pad { padding: 0 18px; }
  .pad-b { padding-bottom: calc(100px + env(safe-area-inset-bottom, 0px)); }

  .glass { background: var(--surface); backdrop-filter: blur(var(--glass-blur)) saturate(160%);
    -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(160%); border: 1px solid var(--border); }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    backdrop-filter: blur(var(--glass-blur)) saturate(150%); -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(150%); }
  .row { display: flex; align-items: center; }
  .between { display: flex; align-items: center; justify-content: space-between; }
  .col { display: flex; flex-direction: column; }
  .mono { font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace; }
  .clip { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  .tap { transition: transform .12s ease, opacity .12s ease, background-color .2s ease, border-color .2s ease; }
  .tap:active { transform: scale(0.96); opacity: 0.9; }

  @keyframes fadeUp { from { transform: translateY(12px); } to { transform: translateY(0); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideIn { from { transform: translateX(26px); } to { transform: translateX(0); } }
  @keyframes popIn { from { transform: scale(0.94) translateY(22px); } to { transform: scale(1) translateY(0); } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
  @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
  @keyframes sheen { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes drift { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 0 var(--ok); animation: pulse 2s infinite; }
  .anim-screen > * { animation: fadeUp .5s cubic-bezier(.2,.7,.2,1) both; }
  .anim-screen > *:nth-child(2) { animation-delay: .04s; }
  .anim-screen > *:nth-child(3) { animation-delay: .08s; }
  .anim-screen > *:nth-child(4) { animation-delay: .12s; }
  .anim-screen > *:nth-child(5) { animation-delay: .16s; }
  .anim-screen > *:nth-child(6) { animation-delay: .20s; }
  .anim-screen > *:nth-child(7) { animation-delay: .24s; }
  .anim-screen > *:nth-child(8) { animation-delay: .28s; }
</style>
</head>

function Icon({ name, size = 22, stroke = 2, fill = "none", style }) {
  const d = ICONS[name];
  if (!d) return null;
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor"
      strokeWidth={stroke} strokeLinecap="round" strokeLinejoin="round" style={style}>
      <path d={d} />
    </svg>
  );
}

function StatusBar() {
  const [t, setT] = useState("");
  useEffect(() => {
    const f = () => { const d = new Date(); let h = d.getHours() % 12 || 12; setT(`${h}:${String(d.getMinutes()).padStart(2,'0')}`); };
    f(); const i = setInterval(f, 10000); return () => clearInterval(i);
  }, []);
  return (
    <div className="statusbar">
      <span className="time">{t}</span>
      <div className="glyphs">
        <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="7.5" width="3" height="4.5" rx="0.7"/><rect x="4.5" y="5" width="3" height="7" rx="0.7"/><rect x="9" y="2.5" width="3" height="9.5" rx="0.7"/><rect x="13.5" y="0" width="3" height="12" rx="0.7"/></svg>

        <svg width="26" height="13" viewBox="0 0 26 13"><rect x="0.5" y="0.8" width="22" height="11.4" rx="3" fill="none" stroke="currentColor" strokeOpacity="0.4"/><rect x="2" y="2.3" width="17" height="8.4" rx="1.8"/><path d="M24 4.5v4c.8-.3 1.4-1.2 1.4-2s-.6-1.7-1.4-2z"/></svg>
      </div>
    </div>
  );
}

const AGENT_GRAD = {
  blue: "linear-gradient(140deg,#5b8cff,#2d5bd6)", purple: "linear-gradient(140deg,#a779ff,#6d3df0)",
  cyan: "linear-gradient(140deg,#3dd9c9,#1f9f93)", green: "linear-gradient(140deg,#34d399,#0e9f6e)",
  amber: "linear-gradient(140deg,#fbbf24,#e08a00)", pink: "linear-gradient(140deg,#f871a0,#d6437a)",
  slate: "linear-gradient(140deg,#94a3c4,#5a6786)",
};

function Avatar({ name, color = "blue", size = 40, icon, glow }) {
  const initials = name ? name.split(" ").map(w => w[0]).slice(0, 2).join("") : "";
  return (
    <div style={{ width: size, height: size, borderRadius: size * 0.32, background: AGENT_GRAD[color] || AGENT_GRAD.blue,
      display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, color: "#fff",
      fontWeight: 680, fontSize: size * 0.36, boxShadow: glow ? `0 6px 18px rgba(91,140,255,0.0), 0 0 0 1px rgba(255,255,255,0.14) inset` : "0 0 0 1px rgba(255,255,255,0.12) inset" }}>
      {icon ? <Icon name={icon} size={size * 0.5} stroke={2} /> : initials}
    </div>
  );
}

function Dot({ color = "var(--ok)", size = 7, pulse }) {
  return <span style={{ width: size, height: size, borderRadius: "50%", background: color, display: "inline-block", flexShrink: 0,
    boxShadow: `0 0 8px ${color}`, animation: pulse ? "pulse 2s infinite" : "none" }} />;
}

function Pill({ children, tone = "neutral", style }) {
  const map = {
    neutral: ["var(--surface-2)", "var(--text-dim)"], ok: ["var(--ok-soft)", "var(--ok)"],
    warn: ["var(--warn-soft)", "var(--warn)"], err: ["var(--err-soft)", "var(--err)"],
    info: ["rgba(var(--accent-rgb),0.16)", "var(--accent)"], purple: ["rgba(167,121,255,0.16)", "var(--purple)"],
    cyan: ["rgba(61,217,201,0.16)", "var(--cyan)"],
  };
  const [bg, fg] = map[tone] || map.neutral;
  return <span style={{ display: "inline-flex", alignItems: "center", gap: 5, background: bg, color: fg,
    fontSize: 11.5, fontWeight: 620, padding: "4px 9px", borderRadius: 100, letterSpacing: 0.1, ...style }}>{children}</span>;
}

function Bar({ value, color = "var(--accent)", h = 6, track = "var(--surface-2)" }) {
  return <div style={{ height: h, borderRadius: h, background: track, overflow: "hidden", width: "100%" }}>
    <div style={{ height: "100%", width: `${Math.min(100, value)}%`, background: color, borderRadius: h, transition: "width .6s cubic-bezier(.2,.7,.2,1)" }} />
  </div>;
}

function Ring({ value, size = 64, stroke = 6, color = "var(--accent)", label, sub }) {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r, off = c * (1 - value / 100);
  return (
    <div style={{ position: "relative", width: size, height: size }}>
      <svg width={size} height={size} style={{ transform: "rotate(-90deg)" }}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--surface-2)" strokeWidth={stroke} />
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={stroke} strokeLinecap="round"
          strokeDasharray={c} strokeDashoffset={off} style={{ transition: "stroke-dashoffset .8s cubic-bezier(.2,.7,.2,1)" }} />
      </svg>
      {label !== undefined && <div style={{ position: "absolute", inset: 0, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center" }}>
        <span style={{ fontSize: size * 0.26, fontWeight: 720, letterSpacing: -0.5 }}>{label}</span>
        {sub && <span style={{ fontSize: 9, color: "var(--text-faint)", fontWeight: 600, marginTop: -1 }}>{sub}</span>}
      </div>}
    </div>
  );
}

function Sparkline({ data, color = "var(--accent)", w = 120, h = 36, fill: doFill = true }) {
  const max = Math.max(...data), min = Math.min(...data), rng = max - min || 1;
  const pts = data.map((v, i) => [ (i / (data.length - 1)) * w, h - ((v - min) / rng) * (h - 4) - 2 ]);
  const line = pts.map(p => p.join(",")).join(" ");
  const area = `0,${h} ${line} ${w},${h}`;
  const gid = useMemo(() => "sg" + Math.random().toString(36).slice(2, 7), []);
  return (
    <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`} style={{ display: "block" }}>
      <defs><linearGradient id={gid} x1="0" y1="0" x2="0" y2="1"><stop offset="0" stopColor={color} stopOpacity="0.28" /><stop offset="1" stopColor={color} stopOpacity="0" /></linearGradient></defs>
      {doFill && <polygon points={area} fill={`url(#${gid})`} />}
      <polyline points={line} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
    </svg>
  );
}

function MiniBars({ data, color = "var(--accent)", w = 120, h = 40, gap = 3 }) {
  const max = Math.max(...data) || 1;
  const bw = (w - gap * (data.length - 1)) / data.length;
  return (
    <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`}>
      {data.map((v, i) => {
        const bh = Math.max(2, (v / max) * h);
        return <rect key={i} x={i * (bw + gap)} y={h - bh} width={bw} height={bh} rx={Math.min(2, bw/2)} fill={color} opacity={0.45 + 0.55 * (v / max)} />;
      })}
    </svg>
  );
}

function Section({ title, action, onAction, style }) {
  return (
    <div className="between" style={{ padding: "0 4px 10px", ...style }}>
      <h3 style={{ margin: 0, fontSize: 15, fontWeight: 680, letterSpacing: -0.2 }}>{title}</h3>
      {action && <button className="tap" onClick={onAction} style={{ fontSize: 13, fontWeight: 600, color: "var(--accent)", display: "flex", alignItems: "center", gap: 2 }}>{action}<Icon name="chevR" size={14} /></button>}
    </div>
  );
}

function Header({ title, sub, onBack, right, large = true }) {
  return (
    <div style={{ padding: large ? "6px 18px 14px" : "2px 18px 12px" }}>
      {onBack && <button className="tap" onClick={onBack} style={{ display: "flex", alignItems: "center", gap: 3, color: "var(--accent)", fontSize: 14, fontWeight: 560, marginBottom: 12, marginLeft: -4 }}><Icon name="chevL" size={18} />Back</button>}
      <div className="between" style={{ alignItems: "flex-end" }}>
        <div style={{ minWidth: 0 }}>
          {sub && <div style={{ fontSize: 12.5, color: "var(--text-faint)", fontWeight: 600, marginBottom: 3, letterSpacing: 0.3, textTransform: "uppercase" }}>{sub}</div>}
          <h1 style={{ margin: 0, fontSize: large ? 30 : 23, fontWeight: 760, letterSpacing: -0.8, lineHeight: 1.05 }}>{title}</h1>
        </div>
        {right}
      </div>
    </div>
  );
}

function GhostBtn({ icon, onClick, size = 40, active, badge }) {
  return (
    <button className="tap glass" onClick={onClick} style={{ width: size, height: size, borderRadius: size, display: "flex", alignItems: "center", justifyContent: "center", position: "relative",
      color: active ? "var(--accent)" : "var(--text-dim)", flexShrink: 0 }}>
      <Icon name={icon} size={size * 0.5} stroke={1.9} />
      {badge && <span style={{ position: "absolute", top: 7, right: 7, width: 8, height: 8, borderRadius: 4, background: "var(--err)", boxShadow: "0 0 0 2px var(--bg)" }} />}
    </button>
  );
}

function Btn({ children, onClick, variant = "primary", icon, full, size = "md", style, disabled }) {
  const pad = size === "lg" ? "15px 22px" : size === "sm" ? "9px 14px" : "13px 18px";
  const fs = size === "lg" ? 16 : size === "sm" ? 13 : 15;
  const base = { display: "flex", alignItems: "center", justifyContent: "center", gap: 8, padding: pad, fontSize: fs, fontWeight: 640,
    borderRadius: 15, width: full ? "100%" : undefined, letterSpacing: -0.1, opacity: disabled ? 0.5 : 1, ...style };
  const variants = {
    primary: { background: "var(--accent)", color: "#fff" },
    solid: { background: "var(--text)", color: "var(--bg)" },
    glass: { background: "var(--surface-2)", color: "var(--text)", border: "1px solid var(--border)" },
    ghost: { background: "transparent", color: "var(--text-dim)" },
    danger: { background: "var(--err-soft)", color: "var(--err)" },
    ok: { background: "var(--ok-soft)", color: "var(--ok)" },
  };
  return <button className="tap" onClick={onClick} disabled={disabled} style={{ ...base, ...variants[variant] }}>{icon && <Icon name={icon} size={fs + 3} stroke={2} />}{children}</button>;
}

function Row({ icon, iconColor, iconBg, title, sub, right, onClick, last, chev }) {
  return (
    <button className="tap" onClick={onClick} style={{ display: "flex", alignItems: "center", gap: 13, padding: "12px 4px", width: "100%", textAlign: "left",
      borderBottom: last ? "none" : "1px solid var(--border)" }}>
      {icon && <div style={{ width: 38, height: 38, borderRadius: 11, background: iconBg || "var(--surface-2)", display: "flex", alignItems: "center", justifyContent: "center", color: iconColor || "var(--text-dim)", flexShrink: 0 }}><Icon name={icon} size={19} stroke={1.9} /></div>}
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ fontSize: 14.5, fontWeight: 580, letterSpacing: -0.1 }}>{title}</div>
        {sub && <div style={{ fontSize: 12.5, color: "var(--text-faint)", marginTop: 1 }} className="clip">{sub}</div>}
      </div>
      {right}
      {chev && <Icon name="chevR" size={17} style={{ color: "var(--text-ghost)" }} />}
    </button>
  );
}

function Sheet({ open, onClose, children, title }) {
  if (!open) return null;
  return (
    <div onClick={onClose} style={{ position: "absolute", inset: 0, zIndex: 300, display: "flex", alignItems: "flex-end", animation: "fadeIn .2s ease" }}>

      <div onClick={e => e.stopPropagation()} className="glass" style={{ position: "relative", width: "100%", borderRadius: "28px 28px 0 0", padding: "10px 18px 38px",
        background: "var(--surface-solid)", borderBottom: "none", animation: "popIn .32s cubic-bezier(.2,.8,.2,1)", maxHeight: "82%", overflowY: "auto" }}>

        {title && <h3 style={{ margin: "0 0 16px", fontSize: 19, fontWeight: 720, letterSpacing: -0.4 }}>{title}</h3>}
        {children}
      </div>
    </div>
  );
}

        <button className="tap" onClick={() => i === 0 ? nav.replace("login") : (setDone(false), setI(i - 1))} style={{ color: "var(--text-faint)", display: "flex", alignItems: "center" }}><Icon name="chevL" size={22} /></button>
        <span style={{ fontSize: 12.5, fontWeight: 640, color: "var(--text-faint)", letterSpacing: 0.3 }}>STEP {i + 1} OF 6</span>
        <button className="tap" onClick={() => nav.replace("dashboard")} style={{ fontSize: 13, color: "var(--text-faint)", fontWeight: 560 }}>Skip</button>
      </div>
      <div style={{ display: "flex", gap: 5, padding: "12px 20px 8px" }}>
        {ONB_STEPS.map((_, k) => (
          <div key={k} style={{ flex: 1, height: 4, borderRadius: 3, background: k <= i ? "var(--accent)" : "var(--surface-2)", transition: "background .4s" }} />
        ))}
      </div>
      <div key={i} style={{ flex: 1, display: "flex", flexDirection: "column", padding: "0 26px 30px", animation: "slideIn .4s cubic-bezier(.2,.7,.2,1)" }}>
        <div style={{ flex: 1, display: "flex", flexDirection: "column", justifyContent: "center" }}>
          <div style={{ alignSelf: "center", position: "relative", marginBottom: 40 }}>
            <div style={{ position: "absolute", inset: -28, borderRadius: "50%", background: "radial-gradient(circle, rgba(var(--accent-rgb),0.28), transparent 70%)", filter: "blur(8px)" }} />
            <div style={{ width: 116, height: 116, borderRadius: 34, position: "relative",
              background: "linear-gradient(155deg, var(--surface-2), var(--surface))", border: "1px solid var(--border-strong)",
              display: "flex", alignItems: "center", justifyContent: "center", color: "var(--accent)", animation: "drift 4s ease-in-out infinite" }}>
              <Icon name={s.icon} size={52} stroke={1.6} />
            </div>
          </div>
          <h1 style={{ margin: "0 0 12px", fontSize: 28, fontWeight: 780, letterSpacing: -0.8, textAlign: "center", lineHeight: 1.1 }}>{s.title}</h1>
          <p style={{ margin: "0 auto", fontSize: 15, color: "var(--text-dim)", textAlign: "center", lineHeight: 1.5, maxWidth: 280 }}>{s.desc}</p>
          {(done && s.note) && (
            <div style={{ display: "flex", alignItems: "center", gap: 9, alignSelf: "center", marginTop: 22, padding: "10px 16px", borderRadius: 100, background: "var(--ok-soft)", animation: "popIn .3s" }}>
              <Icon name="check" size={16} style={{ color: "var(--ok)" }} />
              <span className="mono" style={{ fontSize: 12.5, color: "var(--ok)", fontWeight: 600 }}>{s.note}</span>
            </div>
          )}
        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 11 }}>
          {!done ? (
            <Btn full size="lg" icon={working ? null : s.icon} onClick={act} disabled={working}>
              {working ? <><span style={{ width: 17, height: 17, borderRadius: "50%", border: "2.5px solid rgba(255,255,255,0.35)", borderTopColor: "#fff", animation: "spin .7s linear infinite" }} /> Working…</> : s.action}
            </Btn>
          ) : (
            <Btn full size="lg" icon="arrowR" onClick={next}>Continue</Btn>
          )}
        </div>
      </div>
    </div>
  );
}
</script>

<!-- ════════════════════════════════════════════════════════════════════════════
     OPENCLAW DATA LAYER — live context from local API server
     ════════════════════════════════════════════════════════════════════════════ -->
<script type="text/babel">
const { useCallback } = React;
const DataContext = React.createContext(null);
function useData() { return React.useContext(DataContext); }

async function apiFetch(path) {
  const r = await fetch(path, { cache: "no-store" });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}

function relTime(ms) {
  if (!ms) return "–";
  const s = Math.floor((Date.now() - ms) / 1000);
  if (s < 60) return "just now";
  if (s < 3600) return `${Math.floor(s / 60)}m ago`;
  if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
  return `${Math.floor(s / 86400)}d ago`;
}

function adaptAgent(a, sessions, crons) {
  const colors = ["blue", "purple", "cyan", "green", "amber", "pink", "slate"];
  const h = (a.id||"").split("").reduce((s, c) => s + c.charCodeAt(0), 0);
  const modelName = (a.model || "").replace(/^[^/]+\//, "");

  // find most recent session for this agent
  const agentSessions = (sessions || []).filter(s => s.agentId === a.id);
  agentSessions.sort((x, y) => (y.updatedAt || 0) - (x.updatedAt || 0));
  const latestSession = agentSessions[0];
  const lastMs = latestSession?.updatedAt;
  const ageMs = lastMs ? Date.now() - lastMs : Infinity;

  // derive status from last session age
  const status = ageMs < 5 * 60 * 1000 ? "running" : ageMs < 60 * 60 * 1000 ? "idle" : "idle";

  // session kind breakdown
  const kinds = agentSessions.reduce((acc, s) => { acc[s.kind] = (acc[s.kind] || 0) + 1; return acc; }, {});
  const kindStr = Object.entries(kinds).map(([k, n]) => `${n} ${k}`).join(" · ") || "no sessions";

  // cron jobs for this agent
  const agentCrons = (crons || []).filter(c => c.agentId === a.id);
  const activeCron = agentCrons.find(c => c.enabled);
  const taskStr = activeCron ? `⏱ ${activeCron.name}` : kindStr;

  return {
    id: a.id,
    name: a.identityName || a.id,
    emoji: a.identityEmoji || null,
    color: colors[h % colors.length],
    status,
    task: taskStr,
    model: modelName || "local",
    modelProvider: (a.model || "").split("/")[0] || "local",
    last: relTime(lastMs),
    lastMs,
    sessionCount: agentSessions.length,
    cronCount: agentCrons.length,
    bindings: a.bindings || 0,
    isDefault: !!a.isDefault,
    workspace: a.workspace,
    crons: agentCrons,
    sessions: agentSessions,
  };
}

function adaptTask(t) {
  const colMap = { running: "In Progress", queued: "Pending", succeeded: "Completed", failed: "Completed", cancelled: "Waiting", timed_out: "Completed", lost: "Completed" };
  const prioMap = { failed: "High", timed_out: "High", running: "High", queued: "Normal", succeeded: "Low", cancelled: "Low" };
  const col = colMap[t.status] || "Pending";
  const due = t.endedAt ? new Date(t.endedAt).toLocaleDateString("en", { month: "short", day: "numeric" })
    : t.status === "running" ? "Running" : "Queued";
  const prog = t.status === "succeeded" ? 100 : t.status === "running" ? 50 : 0;
  return {
    id: t.taskId, title: t.label || t.task || t.taskId,
    agent: t.agentId || "Agent", color: t.status === "failed" ? "amber" : "blue",
    priority: prioMap[t.status] || "Normal", due, col,
    ...(t.status === "running" || t.status === "succeeded" ? { prog } : {}),
    ...(t.error ? { block: t.error } : {}),
  };
}

function adaptModel(m, i) {
  const isActive = m.tags?.includes("default") || m.available;
  return {
    id: m.key || `m${i}`, name: m.name,
    family: m.local ? "Local / Ollama" : "Remote",
    size: "–",
    status: m.available && m.tags?.includes("default") ? "active" : m.available ? "loaded" : "available",
    agents: m.tags?.includes("default") ? 1 : 0,
    vram: 0,
    ctx: m.contextWindow ? `${Math.round(m.contextWindow / 1000)}K` : "–",
  };
}

function DataProvider({ children }) {
  const [state, setState] = useState({ agents: [], tasks: [], models: [], sessions: [], crons: [], status: null, sys: null, connected: null, loading: true });

  const refreshRef = useRef(null);
  refreshRef.current = function() {
    Promise.all([
      apiFetch("/api/agents").catch(function() { return null; }),
      apiFetch("/api/tasks").catch(function() { return null; }),
      apiFetch("/api/models").catch(function() { return null; }),
      apiFetch("/api/status").catch(function() { return null; }),
      apiFetch("/api/sessions").catch(function() { return null; }),
      apiFetch("/api/cron").catch(function() { return null; }),
      apiFetch("/api/system").catch(function() { return null; }),
    ]).then(function(results) {
      var agD = results[0], taskD = results[1], modD = results[2], statD = results[3];
      var sessD = results[4], cronD = results[5], sysD = results[6];
      var connected = !!(agD || taskD || modD || statD);
      var sessions = sessD && sessD.sessions ? sessD.sessions : [];
      var crons = cronD && cronD.jobs ? cronD.jobs : [];
      setState({
        agents: (agD && agD.agents ? agD.agents : []).map(function(a) { return adaptAgent(a, sessions, crons); }),
        tasks: (taskD && taskD.tasks ? taskD.tasks : []).map(adaptTask),
        models: (modD && modD.models ? modD.models : []).map(adaptModel),
        sessions: sessions,
        crons: crons,
        status: statD,
        sys: sysD || null,
        connected: connected,
        loading: false,
      });
    }).catch(function() {
      setState(function(s) { return Object.assign({}, s, { connected: false, loading: false }); });
    });
  };

  const refresh = useCallback(function() { refreshRef.current(); }, []);

  useEffect(function() { refreshRef.current(); var t = setInterval(function() { refreshRef.current(); }, 15000); return function() { clearInterval(t); }; }, []);

  return <DataContext.Provider value={{ ...state, refresh }}>{children}</DataContext.Provider>;
}

function ConnectionBadge() {
  const d = useData();
  if (d?.connected === null) return null;
  const ok = d?.connected;
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 5, padding: "3px 9px", borderRadius: 100,
      background: ok ? "var(--ok-soft)" : "rgba(239,68,68,0.12)", fontSize: 11, fontWeight: 640,
      color: ok ? "var(--ok)" : "var(--err)" }}>
      <Dot size={5} color={ok ? "var(--ok)" : "var(--err)"} pulse={ok} />
      {ok ? "Live" : "Offline"}
    </div>
  );
}

function OfflineBanner({ pageName }) {
  const d = useData();
  if (d?.connected !== false) return null;
  return (
    <div style={{ margin: "0 18px 14px", padding: "12px 14px", borderRadius: 14,
      background: "rgba(239,68,68,0.08)", border: "1px solid rgba(239,68,68,0.25)",
      display: "flex", alignItems: "flex-start", gap: 10 }}>
      <Icon name="warn" size={17} stroke={2} style={{ color: "var(--err)", flexShrink: 0, marginTop: 1 }} />
      <div>
        <div style={{ fontSize: 13, fontWeight: 660, color: "var(--err)", marginBottom: 2 }}>Not connected to local server</div>
        <div style={{ fontSize: 12, color: "var(--text-dim)", lineHeight: 1.4 }}>
          {pageName} data is unavailable. Make sure <span className="mono" style={{ fontSize: 11 }}>server.js</span> is running on this device (<span className="mono" style={{ fontSize: 11 }}>node server.js</span>).
        </div>
      </div>
    </div>
  );
}
</script>

     MAIN TAB SCREENS — Dashboard, Agents, Tasks, Files, Mac, Settings

<script type="text/babel">
function StatTile({ icon, label, value, sub, tone = "info", spark }) {
  const tmap = { info: "var(--accent)", ok: "var(--ok)", purple: "var(--purple)", cyan: "var(--cyan)", warn: "var(--warn)" };
  return (
    <div className="card" style={{ padding: 14, flex: 1, minWidth: 0 }}>

        {spark && <MiniBars data={spark} color={tmap[tone]} w={44} h={20} />}
      </div>
      <div style={{ fontSize: 25, fontWeight: 760, letterSpacing: -0.8, marginTop: 10, lineHeight: 1 }}>{value}</div>
      <div style={{ fontSize: 12, color: "var(--text-faint)", fontWeight: 540, marginTop: 4 }}>{label}</div>
    </div>
  );
}

function MetricRing({ icon, label, value, color }) {
  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 7, flex: 1 }}>
      <Ring value={value} size={58} stroke={5} color={color} label={`${value}%`} />
      <div style={{ display: "flex", alignItems: "center", gap: 4, color: "var(--text-faint)" }}>
        <Icon name={icon} size={13} stroke={2} /><span style={{ fontSize: 11, fontWeight: 600 }}>{label}</span>
      </div>
    </div>
  );
}

function Dashboard({ nav }) {
  const d = useData();
  const sys = d?.sys;
  const agents = d?.agents || [];
  const tasks = d?.tasks || [];
  const models = d?.models || [];
  const sessions = d?.sessions || [];

  const agentCount = agents.length;
  const runningTasks = tasks.filter(t => t.col === "In Progress").length;
  const activeModels = models.filter(m => m.status === "active" || m.status === "loaded").length;

  // Activity feed from real tasks + recent sessions
  const activityItems = tasks.slice(0, 6).map(t => ({
    id: t.id,
    label: t.agent || "Agent",
    text: t.title,
    time: t.due,
    tone: t.col === "Completed" ? "ok" : t.col === "In Progress" ? "info" : t.priority === "High" ? "err" : "neutral",
    icon: t.col === "Completed" ? "check" : t.col === "In Progress" ? "play" : t.block ? "warn" : "clock",
    meta: t.block || "",
  }));

  const quicks = [
    { icon: "plus", label: "Create Agent", tone: "info", go: () => nav.push("createAgent") },
    { icon: "columns", label: "New Task", tone: "purple", go: () => nav.go("tasks") },
    { icon: "upload", label: "Upload File", tone: "cyan", go: () => nav.go("files") },
    { icon: "play", label: "Launch Agent", tone: "ok", go: () => nav.go("agents") },
    { icon: "monitor", label: "Mac Control", tone: "warn", go: () => nav.go("mac") },
  ];

  const macOnline = !!sys;
  const macStatus = sys ? `Online · up ${sys.uptime} · ${sys.ip}` : "Connecting…";

  return (
    <div className="screen pad-b anim-screen">
      <Header
        sub={new Date().toLocaleDateString("en", { weekday: "short", month: "short", day: "numeric" })}
        title="Command"
        right={
          <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
            <ConnectionBadge />
            <GhostBtn icon="bell" onClick={() => nav.push("notifications")} />
          </div>
        }
      />
      <OfflineBanner pageName="Dashboard" />

      {/* Mac card — real data */}
      <div className="pad">
        <div className="card" style={{ padding: 16, marginBottom: 14 }}>
          <div className="between" style={{ marginBottom: 16 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 11 }}>
              <div style={{ width: 42, height: 42, borderRadius: 12, background: "var(--surface-2)", display: "flex", alignItems: "center", justifyContent: "center", color: "var(--text)" }}>
                <Icon name="monitor" size={22} stroke={1.8} />
              </div>
              <div>
                <div style={{ fontSize: 15.5, fontWeight: 680, letterSpacing: -0.3 }}>{sys?.model || "Mac"}</div>
                <div style={{ display: "flex", alignItems: "center", gap: 6, marginTop: 2 }}>
                  <Dot pulse={macOnline} color={macOnline ? "var(--ok)" : "var(--text-ghost)"} />
                  <span style={{ fontSize: 12, color: "var(--text-faint)", fontWeight: 540 }}>{macStatus}</span>
                </div>
              </div>
            </div>
            <button className="tap" onClick={() => nav.go("mac")} style={{ color: "var(--text-ghost)" }}>
              <Icon name="chevR" size={20} />
            </button>
          </div>
          <div style={{ display: "flex", gap: 6 }}>
            <MetricRing icon="cpu" label="CPU" value={sys?.cpuPct ?? 0} color="var(--accent)" />
            <MetricRing icon="ram" label="RAM" value={sys?.ramPct ?? 0} color="var(--purple)" />
            <MetricRing icon="gpu" label="GPU" value={0} color="var(--cyan)" />
            <MetricRing icon="disk" label="Disk" value={sys?.diskPct ?? 0} color="var(--ok)" />
          </div>
          {sys && (
            <div style={{ marginTop: 12, display: "flex", gap: 14, paddingTop: 12, borderTop: "1px solid var(--border)" }}>
              {sys.battPct !== null && (
                <div style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 11.5, color: "var(--text-faint)" }}>
                  <Icon name="battery" size={13} stroke={2} />
                  <span>{sys.battPct}% {sys.charging ? "· Charging" : ""}</span>
                </div>
              )}
              <div style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 11.5, color: "var(--text-faint)" }}>
                <Icon name="cpu" size={13} stroke={2} />
                <span className="mono">{sys.load1} load</span>
              </div>
              <div style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 11.5, color: "var(--text-faint)" }}>
                <Icon name="ram" size={13} stroke={2} />
                <span>{sys.ramUsedGb} / {sys.ramTotalGb} GB</span>
              </div>
            </div>
          )}
        </div>
      </div>

      {/* Quick actions */}
      <div style={{ display: "flex", gap: 10, overflowX: "auto", padding: "0 18px 16px", scrollbarWidth: "none" }}>
        {quicks.map((q, i) => {
          const c = { info: "var(--accent)", purple: "var(--purple)", cyan: "var(--cyan)", ok: "var(--ok)", warn: "var(--warn)" }[q.tone];
          return (
            <button key={i} className="tap card" onClick={q.go} style={{ flexShrink: 0, width: 84, padding: "13px 8px", display: "flex", flexDirection: "column", alignItems: "center", gap: 9 }}>
              <div style={{ width: 38, height: 38, borderRadius: 12, background: `color-mix(in oklab, ${c} 16%, transparent)`, display: "flex", alignItems: "center", justifyContent: "center", color: c }}>
                <Icon name={q.icon} size={19} stroke={2} />
              </div>
              <span style={{ fontSize: 11, fontWeight: 580, color: "var(--text-dim)", textAlign: "center", lineHeight: 1.2 }}>{q.label}</span>
            </button>
          );
        })}
      </div>

      {/* Stat tiles — real counts */}
      <div className="pad" style={{ display: "flex", gap: 10, marginBottom: 16 }}>
        <StatTile icon="robot" label="Agents" value={agentCount} tone="info" spark={[1,1,1,1,1,1,agentCount]} />
        <StatTile icon="columns" label="Active tasks" value={runningTasks} tone="purple" spark={[0,0,0,0,0,0,runningTasks]} />
        <StatTile icon="brain" label="Models" value={activeModels} tone="cyan" spark={[0,0,0,0,0,0,activeModels]} />
      </div>

      {/* Activity feed — real tasks */}
      <div className="pad">
        <Section title="Recent Activity" action="All tasks" onAction={() => nav.go("tasks")} />
        <div className="card" style={{ padding: "4px 14px" }}>
          {activityItems.length > 0 ? activityItems.map((a, i) => {
            const tone = { ok: "var(--ok)", info: "var(--accent)", warn: "var(--warn)", err: "var(--err)", neutral: "var(--text-faint)" }[a.tone] || "var(--text-faint)";
            return (
              <div key={a.id} style={{ display: "flex", gap: 12, padding: "12px 0", borderBottom: i < activityItems.length - 1 ? "1px solid var(--border)" : "none" }}>
                <div style={{ width: 30, height: 30, borderRadius: 9, background: `color-mix(in oklab, ${tone} 15%, transparent)`, display: "flex", alignItems: "center", justifyContent: "center", color: tone, flexShrink: 0, marginTop: 2 }}>
                  <Icon name={a.icon} size={15} stroke={2.2} />
                </div>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div className="between" style={{ gap: 8 }}>
                    <span style={{ fontSize: 13, fontWeight: 640, letterSpacing: -0.1 }}>{a.label}</span>
                    <span style={{ fontSize: 11.5, color: "var(--text-ghost)", fontWeight: 540, flexShrink: 0 }}>{a.time}</span>
                  </div>
                  <div style={{ fontSize: 13, color: "var(--text-dim)", marginTop: 2, lineHeight: 1.35 }}>{a.text}</div>
                  {a.meta && <span className="mono" style={{ fontSize: 11, color: "var(--text-faint)", marginTop: 3, display: "inline-block" }}>{a.meta}</span>}
                </div>
              </div>
            );
          }) : (
            <div style={{ padding: "20px 0", textAlign: "center", color: "var(--text-ghost)", fontSize: 13 }}>
              {d?.connected === false ? "Connect to server to see activity" : d?.loading ? "Loading…" : "No recent tasks"}
            </div>
          )}
        </div>

        {/* Sessions summary */}
        {sessions.length > 0 && (
          <div style={{ marginTop: 16 }}>
            <Section title="Recent Sessions" />
            <div className="card" style={{ padding: "4px 14px" }}>
              {sessions.slice(0, 4).map((s, i) => {
                const kindLabel = { direct: "Direct chat", cron: "Cron job", group: "Discord group", "spawn-child": "Sub-agent" }[s.kind] || s.kind;
                const tokens = s.totalTokens ? `${Math.round(s.totalTokens / 1000)}K tokens` : "–";
                return (
                  <div key={s.sessionId} style={{ display: "flex", alignItems: "center", gap: 12, padding: "11px 0", borderBottom: i < Math.min(sessions.length, 4) - 1 ? "1px solid var(--border)" : "none" }}>
                    <div style={{ width: 30, height: 30, borderRadius: 9, background: "var(--surface-2)", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                      <Icon name="message" size={14} stroke={2} style={{ color: "var(--accent)" }} />
                    </div>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ fontSize: 13, fontWeight: 600 }}>{kindLabel}</div>
                      <div className="mono clip" style={{ fontSize: 11, color: "var(--text-ghost)", marginTop: 1 }}>{s.sessionId?.slice(0, 20)}…</div>
                    </div>
                    <div style={{ textAlign: "right", flexShrink: 0 }}>
                      <div style={{ fontSize: 12, color: "var(--text-dim)" }}>{tokens}</div>
                      <div style={{ fontSize: 11, color: "var(--text-ghost)", marginTop: 1 }}>{relTime(s.updatedAt)}</div>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function AgentEmoji({ emoji, name, color, size }) {
  const bg = { blue: "#1e3a5f", purple: "#2d1f4e", cyan: "#0e3340", green: "#1a3320", amber: "#3d2800", pink: "#3d1a2e", slate: "#1e2230" }[color] || "#1e2230";
  return (
    <div style={{ width: size, height: size, borderRadius: size * 0.28, background: bg, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, fontSize: size * 0.46 }}>
      {emoji || name?.charAt(0) || "?"}
    </div>
  );
}

function AgentCard({ a, onClick }) {
  const statusColor = { running: "var(--ok)", idle: "var(--text-ghost)", paused: "var(--warn)", error: "var(--err)" }[a.status] || "var(--text-ghost)";
  const cronBadge = a.cronCount > 0 ? `${a.cronCount} cron` : null;
  const sessBadge = `${a.sessionCount} sessions`;
  return (
    <button className="tap card" onClick={onClick} style={{ padding: 16, width: "100%", textAlign: "left", display: "block" }}>
      {/* Header row */}

// ── Chat history helpers ────────────────────────────────────────────────────
function chatHistoryKey(agentId) { return "jarvis:chat:" + agentId; }

function loadChatHistory(agentId) {
  try { return JSON.parse(localStorage.getItem(chatHistoryKey(agentId)) || "[]"); } catch { return []; }
}

function saveChatHistory(agentId, sessions) {
  try { localStorage.setItem(chatHistoryKey(agentId), JSON.stringify(sessions.slice(-50))); } catch {}
}

function newChatSession(agentId) {
  return { id: "jarvisapp-" + Date.now().toString(36), agentId, createdAt: Date.now(), messages: [] };
}

// ── Chat history list view ──────────────────────────────────────────────────
function ChatHistory({ agent, sessions, onSelect, onNew, onClose }) {
  return (
    <div className="screen anim-screen" style={{ display: "flex", flexDirection: "column" }}>
      <Header title="Chat History" sub={agent.name} left={<GhostBtn icon="chevL" onClick={onClose} />}
        right={

            No previous chats. Start one!

        )}
        {sessions.slice().reverse().map(function(s) {

          const dateStr = new Date(s.createdAt).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
          return (

              style={{ width: "100%", textAlign: "left", padding: "14px 16px", marginBottom: 10, display: "block" }}>

                <span style={{ fontSize: 12, color: "var(--text-ghost)" }}>{dateStr}</span>
                <span style={{ fontSize: 11, color: "var(--text-ghost)", background: "var(--surface-2)", borderRadius: 100, padding: "2px 8px" }}>
                  {s.messages.length} msg{s.messages.length !== 1 ? "s" : ""}
                </span>
              </div>
              <div style={{ fontSize: 13.5, color: "var(--text-dim)", lineHeight: 1.4 }} className="clip">{preview}</div>
            </button>

  );
}

// ── Main AgentChat ──────────────────────────────────────────────────────────
function AgentChat({ agent, onClose }) {
  const d = useData();
  const models = d?.models || [];

  // Chat sessions persisted to localStorage
  const [sessions, setSessions] = useState(function() { return loadChatHistory(agent.id); });
  const [activeSession, setActiveSession] = useState(function() {
    const hist = loadChatHistory(agent.id);
    return hist.length ? hist[hist.length - 1] : newChatSession(agent.id);
  });
  const [showHistory, setShowHistory] = useState(false);

  const [input, setInput] = useState("");
  const [sending, setSending] = useState(false);
  const [error, setError] = useState(null);
  const sessionKeyRef = useRef("agent:" + agent.id + ":" + (activeSession.id));
  const bottomRef = useRef(null);
  const inputRef = useRef(null);

  // Keep sessionKey in sync when active session changes
  useEffect(function() {
    sessionKeyRef.current = "agent:" + agent.id + ":" + activeSession.id;
    setError(null);
  }, [activeSession.id]);

  useEffect(function() {
    if (bottomRef.current) bottomRef.current.scrollIntoView({ behavior: "smooth" });
  }, [activeSession.messages, sending]);

  function persistSession(updated) {
    setSessions(function(prev) {
      const idx = prev.findIndex(function(s) { return s.id === updated.id; });
      var next;
      if (idx >= 0) { next = prev.slice(); next[idx] = updated; }
      else { next = prev.concat(updated); }
      saveChatHistory(agent.id, next);
      return next;
    });
  }

  function startNewChat() {
    const s = newChatSession(agent.id);
    setActiveSession(s);
    setShowHistory(false);
    setError(null);
    setInput("");
  }

  function openSession(s) {
    setActiveSession(s);
    setShowHistory(false);
    setError(null);
    setInput("");
  }

  function send() {
    const text = input.trim();
    if (!text || sending) return;
    setInput("");
    setError(null);
    const userMsg = { role: "user", text, id: Date.now() };
    const updated = Object.assign({}, activeSession, { messages: activeSession.messages.concat(userMsg) });
    setActiveSession(updated);
    persistSession(updated);
    setSending(true);

    fetch("/api/agent/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ agentId: agent.id, message: text, sessionKey: sessionKeyRef.current }),
    })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        setSending(false);
        if (data.error) { setError(data.error); return; }
        const reply = data.reply || data.response || data.content || data.text
          || (data.output && (data.output.text || data.output.content))
          || JSON.stringify(data);
        const agentMsg = { role: "agent", text: reply, id: Date.now() + 1 };
        setActiveSession(function(prev) {
          const next = Object.assign({}, prev, { messages: prev.messages.concat(agentMsg) });
          persistSession(next);
          return next;
        });
      })
      .catch(function() {
        setSending(false);
        setError("Network error — is the server running?");
      });
  }

  function handleKey(e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  }

  if (showHistory) {
    return <ChatHistory agent={agent} sessions={sessions} onSelect={openSession} onNew={startNewChat} onClose={function() { setShowHistory(false); }} />;
  }

  const messages = activeSession.messages;

  return (
    <div className="screen anim-screen" style={{ display: "flex", flexDirection: "column", height: "100%" }}>
      {/* Header */}
      <Header
        title={agent.name}
        sub={<span className="mono" style={{ fontSize: 11 }}>{agent.model}</span>}
        left={<GhostBtn icon="chevL" onClick={onClose} />}
        right={
          <div style={{ display: "flex", gap: 7, alignItems: "center" }}>
            <button className="tap" onClick={function() { setShowHistory(true); }}
              style={{ display: "flex", alignItems: "center", gap: 5, padding: "5px 10px", borderRadius: 100,
                background: "var(--surface)", border: "1px solid var(--border)", fontSize: 12, fontWeight: 600, color: "var(--text-dim)" }}>
              <Icon name="clock" size={13} stroke={2} />
              History
            </button>
            <button className="tap" onClick={startNewChat}
              style={{ display: "flex", alignItems: "center", gap: 5, padding: "5px 10px", borderRadius: 100,
                background: "var(--accent)", color: "#fff", fontSize: 12, fontWeight: 660, border: "none" }}>
              <Icon name="plus" size={13} stroke={2.5} />
              New
            </button>
          </div>
        }
      />

      {/* Model badge — read only, model is set in agent config */}
      <div style={{ padding: "0 18px 10px" }}>
        <div style={{ display: "inline-flex", alignItems: "center", gap: 5, padding: "5px 10px", borderRadius: 100,
          background: "var(--surface)", border: "1px solid var(--border)", fontSize: 12, fontWeight: 600, color: "var(--text-dim)" }}>
          <Icon name="brain" size={13} stroke={2} />
          <span className="mono">{agent.model}</span>
        </div>
      </div>

      {/* Empty state */}
      {messages.length === 0 && !sending && (
        <div style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 32, gap: 16 }}>
          <AgentEmoji emoji={agent.emoji} name={agent.name} color={agent.color} size={64} />
          <div style={{ textAlign: "center" }}>
            <div style={{ fontSize: 18, fontWeight: 700, letterSpacing: -0.3, marginBottom: 6 }}>{agent.name}</div>
            <div style={{ fontSize: 13, color: "var(--text-faint)", lineHeight: 1.5 }}>
              Running <span className="mono">{agent.model}</span> via {agent.modelProvider}.<br />
              Send a message to start a conversation.
            </div>
          </div>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 8, justifyContent: "center", marginTop: 8 }}>
            {["What can you help me with?", "Summarise recent activity", "What's in my workspace?"].map(function(q) {
              return (
                <button key={q} className="tap" onClick={function() { setInput(q); if (inputRef.current) inputRef.current.focus(); }}
                  style={{ padding: "8px 14px", borderRadius: 100, fontSize: 12.5, fontWeight: 560,
                    background: "var(--surface)", border: "1px solid var(--border)", color: "var(--text-dim)" }}>
                  {q}
                </button>
              );
            })}
          </div>
        </div>
      )}

      {/* Messages */}
      {(messages.length > 0 || sending) && (
        <div style={{ flex: 1, overflowY: "auto", padding: "0 18px", display: "flex", flexDirection: "column", gap: 12 }}>
          {messages.map(function(msg) {
            return (
              <div key={msg.id} style={{ display: "flex", flexDirection: msg.role === "user" ? "row-reverse" : "row", gap: 10, alignItems: "flex-end" }}>
                {msg.role === "agent" && (
                  <div style={{ flexShrink: 0, marginBottom: 2 }}>
                    <AgentEmoji emoji={agent.emoji} name={agent.name} color={agent.color} size={28} />
                  </div>
                )}
                <div style={{
                  maxWidth: "78%", padding: "10px 14px", borderRadius: msg.role === "user" ? "18px 18px 4px 18px" : "18px 18px 18px 4px",
                  background: msg.role === "user" ? "var(--accent)" : "var(--surface)",
                  color: msg.role === "user" ? "#fff" : "var(--text)",
                  fontSize: 14, lineHeight: 1.5, whiteSpace: "pre-wrap", wordBreak: "break-word",
                }}>
                  {msg.text}
                </div>
              </div>
            );
          })}
          {sending && (
            <div style={{ display: "flex", gap: 10, alignItems: "flex-end" }}>
              <AgentEmoji emoji={agent.emoji} name={agent.name} color={agent.color} size={28} />
              <div style={{ padding: "12px 16px", borderRadius: "18px 18px 18px 4px", background: "var(--surface)", display: "flex", gap: 5, alignItems: "center" }}>
                {[0,1,2].map(function(i) {
                  return <div key={i} style={{ width: 7, height: 7, borderRadius: "50%", background: "var(--text-ghost)",
                    animation: "pulse 1.2s ease-in-out " + (i*0.2) + "s infinite" }} />;
                })}
              </div>
            </div>
          )}
          {error && (
            <div style={{ padding: "10px 14px", borderRadius: 12, background: "rgba(239,68,68,0.08)", border: "1px solid rgba(239,68,68,0.2)",
              display: "flex", gap: 10, alignItems: "flex-start" }}>
              <Icon name="warn" size={15} stroke={2} style={{ color: "var(--err)", flexShrink: 0, marginTop: 1 }} />
              <span style={{ fontSize: 13, color: "var(--err)", lineHeight: 1.4 }}>{error}</span>
            </div>
          )}
          <div ref={bottomRef} style={{ height: 1 }} />
        </div>
      )}

      {/* Input bar */}
      <div style={{ padding: "12px 18px calc(20px + 80px + env(safe-area-inset-bottom, 0px))", borderTop: messages.length ? "1px solid var(--border)" : "none", background: "var(--bg)" }}>
        <div style={{ display: "flex", gap: 10, alignItems: "flex-end", background: "var(--surface)", borderRadius: 20, padding: "8px 8px 8px 16px", border: "1px solid var(--border-strong)" }}>
          <textarea ref={inputRef} value={input} onChange={function(e) { setInput(e.target.value); }} onKeyDown={handleKey}
            placeholder={"Message " + agent.name + "…"} rows={1}
            style={{ flex: 1, background: "none", border: "none", outline: "none", color: "var(--text)", fontSize: 14.5,
              fontFamily: "inherit", resize: "none", maxHeight: 120, lineHeight: 1.5, paddingTop: 2 }} />
          <button className="tap" onClick={send} disabled={!input.trim() || sending}
            style={{ width: 38, height: 38, borderRadius: "50%", background: input.trim() && !sending ? "var(--accent)" : "var(--surface-2)",
              display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0,
              color: input.trim() && !sending ? "#fff" : "var(--text-ghost)", transition: "background 0.15s" }}>
            <Icon name="send" size={17} stroke={2.2} />
          </button>
        </div>
        <div style={{ fontSize: 11, color: "var(--text-ghost)", textAlign: "center", marginTop: 7 }}>
          Messages go via <span className="mono">openclaw agent</span> · responses may take 10–60s
        </div>
      </div>
    </div>
  );
}

function Files({ nav }) {

          <div className="between" style={{ marginBottom: 10 }}>
            <span style={{ fontSize: 13.5, fontWeight: 620 }}>Mac Disk</span>
            <span className="mono" style={{ fontSize: 12, color: "var(--text-faint)" }}>{diskUsed} / {diskTotal} GB</span>
          </div>
          <Bar value={diskPct} color="var(--accent)" h={7} />
          <div style={{ display: "flex", gap: 16, marginTop: 11 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
              <Dot color="var(--accent)" size={7} />
              <span style={{ fontSize: 11.5, color: "var(--text-faint)", fontWeight: 540 }}>Used {diskPct}%</span>
            </div>

              <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                <Dot color="var(--purple)" size={7} />

        </div>

        {/* Folder pills */}
        {folders.length > 0 && !q && (
          <div style={{ marginBottom: 14 }}>
            <div style={{ fontSize: 12, fontWeight: 700, letterSpacing: 0.5, color: "var(--text-ghost)", marginBottom: 8 }}>FOLDERS</div>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
              <button className="tap" onClick={() => setFolder("")}
                style={{ padding: "6px 13px", borderRadius: 100, fontSize: 12.5, fontWeight: 600,
                  background: folder === "" ? "var(--accent)" : "var(--surface)",
                  color: folder === "" ? "#fff" : "var(--text-dim)",
                  border: folder === "" ? "none" : "1px solid var(--border)" }}>
                All
              </button>
              {folders.filter(f => !["MEMORY.md","Untitled.canvas","Untitled.base"].includes(f.name)).map(f => (
                <button key={f.name} className="tap" onClick={() => setFolder(folder === f.name ? "" : f.name)}
                  style={{ padding: "6px 13px", borderRadius: 100, fontSize: 12.5, fontWeight: 600,
                    background: folder === f.name ? "var(--accent)" : "var(--surface)",
                    color: folder === f.name ? "#fff" : "var(--text-dim)",
                    border: folder === f.name ? "none" : "1px solid var(--border)" }}>
                  {f.name} <span style={{ opacity: 0.6, fontSize: 11 }}>{f.count}</span>

            <div style={{ padding: 32, textAlign: "center", color: "var(--text-ghost)", fontSize: 13 }}>Loading files…</div>

function useSysData() {
  const [sys, setSys] = useState(null);
  const [loading, setLoading] = useState(true);
  const refreshRef = useRef(null);
  refreshRef.current = function() {
    fetch("/api/system", { cache: "no-store" })
      .then(function(r) { return r.ok ? r.json() : null; })
      .then(function(data) { if (data) setSys(data); setLoading(false); })
      .catch(function() { setLoading(false); });
  };
  useEffect(function() {
    refreshRef.current();
    const t = setInterval(function() { refreshRef.current(); }, 8000);
    return function() { clearInterval(t); };
  }, []);
  return { sys, loading, refresh: function() { refreshRef.current(); } };
}

function MacMetricRow({ icon, label, pct, color, sub }) {

        <span className="mono" style={{ fontSize: 12, color: "var(--text-faint)" }}>{sub}</span>
      </div>
      <Bar value={pct} color={color} h={7} />
    </div>
  );
}

<script type="text/babel">
function TopBar({ title, sub, onBack, right, center }) {
  return (
    <div className="between" style={{ padding: "6px 14px 10px", gap: 8, flexShrink: 0 }}>
      <button className="tap glass" onClick={onBack} style={{ width: 38, height: 38, borderRadius: 38, display: "flex", alignItems: "center", justifyContent: "center", color: "var(--text-dim)", flexShrink: 0 }}><Icon name="chevL" size={20} /></button>
      <div style={{ flex: 1, minWidth: 0, textAlign: center ? "center" : "left" }}>
        <div style={{ fontSize: 15.5, fontWeight: 700, letterSpacing: -0.3 }} className="clip">{title}</div>
        {sub && <div style={{ fontSize: 11.5, color: "var(--text-faint)", marginTop: 1 }} className="clip">{sub}</div>}
      </div>
      {right || <div style={{ width: 38 }} />}
    </div>
  );
}

function MD({ text }) {
  return text.split("\n").map((ln, i) => {
    const parts = ln.split(/(\*\*[^*]+\*\*)/g).map((p, j) => p.startsWith("**") ? <strong key={j} style={{ fontWeight: 720 }}>{p.slice(2, -2)}</strong> : p);
    const isNum = /^\d+\.\s/.test(ln);
    return <div key={i} style={{ marginBottom: 3, paddingLeft: isNum ? 4 : 0, lineHeight: 1.5 }}>{parts}</div>;
  });
}

<script type="text/babel">

// ── Signal math ──────────────────────────────────────────────────────────────
function calcRSI(prices, period = 14) {
  if (prices.length < period + 1) return null;
  let gains = 0, losses = 0;
  for (let i = 1; i <= period; i++) {
    const d = prices[i] - prices[i - 1];
    if (d > 0) gains += d; else losses -= d;
  }
  let ag = gains / period, al = losses / period;
  for (let i = period + 1; i < prices.length; i++) {
    const d = prices[i] - prices[i - 1];
    ag = (ag * (period - 1) + Math.max(d, 0)) / period;
    al = (al * (period - 1) + Math.max(-d, 0)) / period;
  }
  return al === 0 ? 100 : 100 - 100 / (1 + ag / al);
}

function calcMA(prices, period) {
  if (prices.length < period) return null;
  const s = prices.slice(-period);
  return s.reduce((a, b) => a + b, 0) / period;
}

function getSignals(prices) {
  if (!prices || prices.length < 5) return { signal: "NEUTRAL", rsi: null, ma20: null, ma50: null };
  const rsi = calcRSI(prices);
  const ma20 = calcMA(prices, Math.min(20, prices.length));
  const ma50 = calcMA(prices, Math.min(50, prices.length));
  const cur = prices[prices.length - 1];
  let bull = 0, bear = 0;
  if (rsi !== null) {
    if (rsi < 30) bull += 3; else if (rsi > 70) bear += 3;
    else if (rsi < 40) bull += 1; else if (rsi > 60) bear += 1;
  }
  if (ma20) { if (cur > ma20) bull += 1; else bear += 1; }
  if (ma50 && ma20) { if (ma20 > ma50) bull += 1; else bear += 1; }
  const signal = bull >= bear + 2 ? "BUY" : bear >= bull + 2 ? "SELL" : "HOLD";
  return { signal, rsi: rsi ? Math.round(rsi) : null, ma20, ma50 };
}

// ── Paper portfolio helpers ───────────────────────────────────────────────────
const PORTFOLIO_KEY = "ac_trading_portfolio";
const ALERTS_KEY = "ac_trading_alerts";
const INITIAL_BALANCE = 100000;

function loadPortfolio() {
  try { return JSON.parse(localStorage.getItem(PORTFOLIO_KEY)) || { balance: INITIAL_BALANCE, positions: [], trades: [] }; }
  catch { return { balance: INITIAL_BALANCE, positions: [], trades: [] }; }
}
function savePortfolio(p) { try { localStorage.setItem(PORTFOLIO_KEY, JSON.stringify(p)); } catch {} }
function loadAlerts() { try { return JSON.parse(localStorage.getItem(ALERTS_KEY)) || []; } catch { return []; } }
function saveAlerts(a) { try { localStorage.setItem(ALERTS_KEY, JSON.stringify(a)); } catch {} }

function fmtNum(n, decimals = 2) {
  if (n == null) return "—";
  return n.toLocaleString("en-US", { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
}
function fmtCcy(n) { return n == null ? "—" : "$" + fmtNum(Math.abs(n), 2); }

// ── Sparkline ─────────────────────────────────────────────────────────────────
function Sparkline({ prices, w = 120, h = 36, positive }) {
  if (!prices || prices.length < 2) return <svg width={w} height={h} />;
  const mn = Math.min(...prices), mx = Math.max(...prices);
  const rng = mx - mn || 1;
  const pts = prices.map((p, i) => `${(i / (prices.length - 1)) * w},${h - ((p - mn) / rng) * (h - 4) - 2}`).join(" ");
  const color = positive ? "var(--ok)" : "var(--err)";
  return (
    <svg width={w} height={h} style={{ overflow: "visible" }}>
      <polyline points={pts} fill="none" stroke={color} strokeWidth={1.8} strokeLinecap="round" strokeLinejoin="round" />
    </svg>
  );
}
